name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sltest
          POSTGRES_PASSWORD: sltest
          POSTGRES_DB: shared_lists_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sltest -d shared_lists_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://sltest:sltest@localhost:5432/shared_lists_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations to the test database
        run: DATABASE_URL=$TEST_DATABASE_URL bunx prisma migrate deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
