version: '3.8'

services:
  web:
    build: .
    container_name: shared-lists-web
    ports:
      - "127.0.0.1:3006:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # CA of a credential proxy for the model client (NODE_EXTRA_CA_CERTS).
    volumes:
      - ./certs:/run/certs:ro
    networks:
      - stack_default

  # One-off container for migrations and scripts, built from the Dockerfile's
  # builder stage (the runner image has neither scripts/ nor prisma.config.ts).
  # Never started by `docker compose up`; run it with
  # `docker compose run --rm --build tools <command>`.
  tools:
    build:
      context: .
      target: builder
    profiles:
      - tools
    env_file:
      - .env
    networks:
      - stack_default

networks:
  stack_default:
    external: true
